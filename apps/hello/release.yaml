apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hello-app
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: http-echo
      version: "0.2.3"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    service:
      type: ClusterIP
    args:
      - "-text=Hello from Flux CD + Helm in k3d!"
