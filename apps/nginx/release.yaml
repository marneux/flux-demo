apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: bitnami-nginx
    namespace: flux-system
  values:
    replicaCount: 1
    image:
      tag: 1.31.2-debian-12-r0
      pullPolicy: IfNotPresent
